<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver's CS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    
</head>
<body>
    <section class="head">
        <a class="outbrief-process" id="outbriefLink" href="outbrief.html">Go To Outbrief Process</a>
    </section>
    <section class="greet">
        <h1 id="date"></h1>
        <h1 id="greeting"></h1>
        <p id="message"></p>
    </section>

    <section class="warning">
        <h1 id="warning-h1"></h1>
        <p id="warning-message"></p>
    </section>

    <section class="section-driver-details">
        <input type="text" id="location" class="location" name="location" placeholder="BBSA">
        <input type="text" id="route" class="route" name="routenumber" placeholder="201">
        <button id="showButton" type="button">SHOW</button><br>
    </section>

    <section class="buttons">
        

        <h2 id="name"></h2>
        <h3 id="scanner"></h3>
        <h3 id="printer"></h3>
        <h3 id="sparebattery"></h3>
        <h3 id="count"></h3>

    </section>

    <section class="buttons">
        <button id="req2clear" type="button">REQUEST TO CLEAR</button><br>
        <p id="message-to-r2c"></p>

    </section>

    

    <script src="index.js"></script>
    <script src="driverDeatils.js"></script>
    
</body>
</html>
