<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbrief Process</title>
</head>
<body>
    <a class="outbrief-process" href="index.html"></a>

    <section class="basic-data">
        <h1 id="date"></h1>
        <h1 id="location"></h1>
        <h2 id="route-number">Route Number: </h2>
    </section>

    <section class="section-baycheck">
        <h1 class="section-h1-baycheck">Baychecks</h1>

        <input type="text" id="postcode1" name="postcode1" placeholder="Enter Postcode">
        <input type="text" id="reason1" name="reason1" placeholder="Enter Reason"><br>
        <input type="text" id="postcode2" name="postcode2" placeholder="Enter Postcode">
        <input type="text" id="reason2" name="reason2" placeholder="Enter Reason"><br>
        <input type="text" id="postcode3" name="postcode3" placeholder="Enter Postcode">
        <input type="text" id="reason3" name="reason3" placeholder="Enter Reason">
    </section>

    <section class="section-bulk">
        <h1 class="section-h1-bulk">Bulk</h1>
        <input type="text" id="bulk1" name="bulk1" placeholder="Enter Postcode">
        <input type="text" id="bulk2" name="bulk2" placeholder="Enter Postcode"><br>
        <input type="text" id="bulk3" name="bulk3" placeholder="Enter Postcode">
        <input type="text" id="bulk4" name="bulk4" placeholder="Enter Postcode"><br>
        <input type="text" id="bulk5" name="bulk5" placeholder="Enter Postcode">
        <input type="text" id="bulk6" name="bulk6" placeholder="Enter Postcode">
    </section>

    <section class="signed-section">
        <h1 id="section-h1-signed" class="section-h1-signed"></h1>
    </section>

    <section>
        <button id="submitButton" type="button">Submit</button><br>
    </section>

    <script src="index.js"></script>
    <script src="data.js"></script>
    <script src="outbrief.js"></script>
</body>
</html>
