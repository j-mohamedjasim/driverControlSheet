<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbrief Process</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="backButton">
        <a class="outbrief-process" href="index.html">Back</a>
        <br><br>
    </section>

    <div class="case-box template" style="display:none;">
        <h1 class="tracking"></h1>
        <p class="case-type"></p>
        <p class="case-address"></p>
        <p class="instruction"></p>
        <p class="case-handler"></p>

        <section class="button-section">
            <button class="complete-btn" type="button">Complete</button>
            <button class="not-complete-btn" type="button">Not Complete</button>
        </section>
    </div>

    <div id="cases-container"></div>


    <div id="reasonModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Reason for Not Complete</h3>
            <textarea id="reasonInput" rows="4" placeholder="Type reason here..."></textarea>
            <button id="reasonSubmit">Submit</button>
            <button id="reasonCancel">Cancel</button>
        </div>
    </div>


    <section class="basic-data">
        <h1 id="date"></h1>
        <h1 id="location"></h1>
        <h2 id="route-number">Route Number: </h2>
    </section>

    <section class="section-baycheck">
        <h1 class="section-h1-baycheck">Baychecks</h1>

        <input type="text" class="pandr" id="postcode1" name="postcode1" placeholder="Enter Postcode">
        <input type="text" class="pandr" id="reason1" name="reason1" placeholder="Enter Reason"><br><br><br>
        <input type="text" class="pandr" id="postcode2" name="postcode2" placeholder="Enter Postcode">
        <input type="text" class="pandr" id="reason2" name="reason2" placeholder="Enter Reason"><br><br><br>
        <input type="text" class="pandr" id="postcode3" name="postcode3" placeholder="Enter Postcode">
        <input type="text" class="pandr" id="reason3" name="reason3" placeholder="Enter Reason">
    </section>

    <section class="section-bulk">
        <h1 class="section-h1-bulk">Bulk</h1>
        <input type="text" class="bulksection" id="bulk1" name="bulk1" placeholder="Enter Postcode">
        <input type="text" class="bulksection" id="bulk2" name="bulk2" placeholder="Enter Postcode"><br><br><br>
        <input type="text" class="bulksection" id="bulk3" name="bulk3" placeholder="Enter Postcode">
        <input type="text" class="bulksection" id="bulk4" name="bulk4" placeholder="Enter Postcode"><br><br><br>
        <input type="text" class="bulksection" id="bulk5" name="bulk5" placeholder="Enter Postcode">
        <input type="text" class="bulksection" id="bulk6" name="bulk6" placeholder="Enter Postcode">
    </section>

    <section class="rdna-and-timecard-section">
        <h1>RDNA and Timecard</h1>
        <p><i>Please below status are logged into your scanner before you check them.</i></p>
        <br><br>
        <h4>RDNA Status</h4>
        <label class="radio-label"><input id="radio-button-rdna-yes" class="radio-button" type="radio" name="RDNA" value="Yes"><span class="radio-custom"></span>Yes</label>
        <label class="radio-label"><input  id="radio-button-rdna-no" class="radio-button" type="radio" name="RDNA" value="No"><span class="radio-custom"></span>No</label><br><br>

        <h4>Timecard Status</h4>

        <label class="radio-label"><input  id="radio-button-time-yes" class="radio-button" type="radio" name="timecard" value="Yes"><span class="radio-custom"></span>Yes</label>
        <label class="radio-label"><input  id="radio-button-time-no" class="radio-button" type="radio" name="timecard" value="No"><span class="radio-custom"></span>No</label>
    </section>

    <section class="signed-section">
        <h1 id="section-h1-signed" class="section-h1-signed"></h1>
    </section>

    <section>
        <button id="submitButton" type="button">Submit</button><br>
    </section>

    <script src="index.js"></script>
    <script src="data.js"></script>
    <script src="outbrief.js"></script>
</body>
</html>
